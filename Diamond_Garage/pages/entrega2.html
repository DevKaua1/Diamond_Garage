<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega | Diamond Garage</title>
  <link rel="stylesheet" href="../css/pages/entrega2.css">
  <link rel="shortcut icon" href="../Images/simbolo_transparente.png">
</head>
<body>

  <header class="cabecalho">
    <a href="home.html"><img class="logo" src="../Images/completa_transparente.png" alt="Diamond Garage"></a>
    <div class="seguro">🔒 Compra segura</div>
  </header>

  <div class="etapas">
    <span class="ok"><i>✓</i><em>Carrinho</em></span><hr>
    <span class="atual"><i>2</i><em>Entrega</em></span><hr class="cinza">
    <span><i>3</i><em>Pagamento</em></span>
  </div>

  <main class="ent">

    <section class="caixa">
      <h2>Dados de entrega</h2>
      <p class="sub">Informe para onde devemos enviar as suas peças.</p>

      <form id="form" novalidate>
        <div class="campos">
          <div class="c-total">
            <label for="nome">Nome completo</label>
            <input id="nome" type="text" placeholder="Como você se chama" autocomplete="name">
          </div>
          <div>
            <label for="cpf">CPF</label>
            <input id="cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00">
          </div>
          <div>
            <label for="tel">Telefone</label>
            <input id="tel" type="text" inputmode="numeric" maxlength="15" placeholder="(00) 00000-0000" autocomplete="tel">
          </div>
          <div>
            <label for="cep">CEP</label>
            <input id="cep" type="text" inputmode="numeric" maxlength="9" placeholder="00000-000" autocomplete="postal-code">
          </div>
          <div class="c-total">
            <label for="rua">Endereço</label>
            <input id="rua" type="text" placeholder="Rua, avenida..." autocomplete="address-line1">
          </div>
          <div>
            <label for="numero">Número</label>
            <input id="numero" type="text" inputmode="numeric" maxlength="6" placeholder="Nº">
          </div>
          <div>
            <label for="comp">Complemento <small>(opcional)</small></label>
            <input id="comp" type="text" placeholder="Apto, bloco...">
          </div>
          <div class="c-total">
            <label for="bairro">Bairro</label>
            <input id="bairro" type="text" placeholder="Seu bairro">
          </div>
          <div>
            <label for="cidade">Cidade</label>
            <input id="cidade" type="text" placeholder="Sua cidade">
          </div>
          <div>
            <label for="uf">Estado</label>
            <select id="estado"></select>
          </div>
        </div>

        <h3>Opção de entrega</h3>
        <div class="opcoes" id="opcoes">
          <label class="opcao on">
            <input type="radio" name="frete" value="padrao" checked>
            <div><b>Entrega padrão</b><small>5 a 8 dias úteis</small></div>
            <span class="preco">Grátis</span>
          </label>
          <label class="opcao">
            <input type="radio" name="frete" value="expresso">
            <div><b>Entrega expressa</b><small>2 a 3 dias úteis</small></div>
            <span class="preco">R$ 29,90</span>
          </label>
        </div>

        <div class="botoes">
          <a class="voltar" href="carrinho.html">← Voltar ao carrinho</a>
          <button class="continuar" type="submit">Continuar para o pagamento</button>
        </div>
      </form>
    </section>

    <aside class="resumo">
      <h3 class="res-til">Resumo do pedido</h3>
      <div id="itens"></div>
      <div class="ln"><span>Subtotal</span><span id="st"></span></div>
      <div class="ln"><span>Frete</span><span id="fr"></span></div>
      <div class="tot"><span>Total</span><b id="tt"></b></div>
      <p class="prazo">🚚 Chega em <b id="prazo"></b></p>
    </aside>

  </main>

  <script src="../js/pages/entrega2.js"></script>
</body>
</html>
