<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrega | Diamond Garage</title>
    <link rel="stylesheet" href="/css/pages/entrega.css">
    <link rel="shortcut icon" href="../Images/simbolo_transparente.png">

</head>

<body>
    <header class="cabecalho">
        <img class="logo-prin" src="/Images/completa_transparente.png" alt="LOGO-PRINCIPAL">

        <nav>
            <div class="ben">
                <i>🔒</i>
                <div>Compra seguro</div>
        </nav>
    </header>
    <div class="etapas">
        <span class="ok"> <i> ✓ </i><em>Carrinho</em></span>
        <hr style="  border-top: 2px solid #d4af37;">
        <span class="confirm"> <i> 2 </i><em>Entrega</em></span>
        <hr>
        <span class="falta"> <i> 3 </i><em>Pagamento</em></span>
    </div>


    <div class="global">
        <div class="cont">
            <br>
            <h2>Dados de entrega</h2>
            <p class="sub">Informe para onde devemos enviar as suas peças.</p>
            <label for="name" class="nome">Nome Completo</label>
            <input type="text" id="name" name="name" required>
            <div class="dados">
                <div class="cpf">
                    <label for="cpf">CPF</label>
                    <input type="number" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>
                <div class="tel">
                    <label for="telefone">Telefone</label>
                    <input type="number" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                </div>
            </div>
            <label for="cep" class="cep">CEP</label>
            <input type="number" id="cep" name="cep" placeholder="00000-000" required>
            <div class="endereco">
                <div class="rua">
                    <label for="rua">Endereço</label>
                    <input type="text" id="rua" name="rua" placeholder="Nome da rua" required>
                </div>
                <br>
                <div class="address">
                    <div class="num">
                        <label for="numero">Numero</label>
                        <input type="number" id="numero" name="numero" placeholder="123" required>
                    </div>
                    <div class="comple">
                        <label for="complemento">Complemento (opcional)</label>
                        <input type="text" id="complemento" name="complemento" placeholder="Complemento">
                    </div>
                </div>
                <br>
                <div class="bairro">
                    <label for="numero">Bairro</label>
                    <input type="text" id="bairro" name="bairro" required>
                </div>
                <br>    

                <div class="lugar">
                    <div class="cidade">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" required>
                    </div>
                    <div class="estado">
                        <label for="uf">Estado</label>
                        <select id="uf"></select>
                    </div>
                        
                    </div>
                </div>
        <h3>Opção de entrega</h3>
                
                 <div class="opcoes" id="opcoes">
          <label class="opcao on">
            <input type="radio" name="frete" value="padrao" checked>
            <div><b>Entrega padrão</b><small>5 a 8 dias úteis</small></div>
            <span class="preco">Grátis</span>
          </label>
          <label class="opcao">
            <input type="radio" name="frete" value="expresso">
            <div><b>Entrega expressa</b><small>2 a 3 dias úteis</small></div>
            <span class="preco">R$ 29,90</span>
          </label>
        </div>

        <div class="botoes">
          <a class="voltar" href="carrinho.html">← Voltar ao carrinho</a>
          <button class="continuar" type="submit">Continuar para o pagamento</button>
        </div>
      </form>
                
            </div>
            <div class="resumo">
                <h3 class="res-til">Resumo do pedido</h3>
                <div id="itens"></div>
                <div class="ln"><span>Subtotal</span><span id="st"></span></div>
                <div class="ln"><span>Frete</span><span id="fr"></span></div>
                <div class="tot"><span>Total</span><b id="tt"></b></div>
                <p class="prazo">🚚 Chega em <b id="prazo"></b></p>
            </div>
            
    </div>




<script src="../js/pages/entrega.js"></script>
</body>

</html>
